name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@latest
            - name: Set up Node.js
              uses: actions/setup-node@latest
              with:
                node-version: '24'
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test