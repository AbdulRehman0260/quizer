name: CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build services with Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for database to be ready
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres -d questions; do sleep 1; done'

      - name: Run database migrations
        run: docker compose exec -T backend npm run migrate

      - name: Run backend tests
        run: docker compose exec -T backend npm test -- --passWithNoTests

      - name: Cleanup
        if: always()
        run: docker compose down -v