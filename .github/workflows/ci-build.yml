name: CI Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services with Docker Compose
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for database to be ready
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U quiz_app -d questions; do sleep 1; done'

      - name: Run database migrations
        run: docker compose exec -T backend npm run migrate

      - name: Run backend tests
        run: docker compose exec -T backend npm test

      - name: Run frontend linting
        run: docker compose exec -T frontend npm run lint

      - name: Run frontend tests
        run: docker compose exec -T frontend npm test

      - name: Build frontend
        run: docker compose exec -T frontend npm run build

      - name: Cleanup
        if: always()
        run: docker compose down -v